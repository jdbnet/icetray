name: icetray
arch: ${NFPM_ARCH}
platform: linux
version: ${NFPM_VERSION}
section: sound
priority: optional
maintainer: Jamie <jamie@jdbnet.co.uk>
description: |-
  Lightweight system tray internet radio player with a Wails player UI,
  stream artwork, Icecast now-playing metadata, and automatic reconnection.
vendor: JDB-NET
homepage: https://github.com/jdbnet/icetray
license: MIT

contents:
  - src: dist/nfpm-staging/icetray
    dst: /usr/local/bin/icetray
    file_info:
      mode: 0755
  - src: packaging/linux/icetray.desktop
    dst: /usr/share/applications/icetray.desktop
  - src: assets/icon.png
    dst: /usr/share/icons/hicolor/256x256/apps/icetray.png

deb:
  compression: gzip
  depends:
    - libgtk-3-0
    - libwebkit2gtk-4.1-0
    - libayatana-appindicator3-1
    - libasound2
