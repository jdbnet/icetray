# Feel free to remove those if you don't want/need to use them.
# Make sure to check the documentation at https://nfpm.goreleaser.com
#
# The lines below are called `modelines`. See `:help modeline`

name: "icetray"
arch: ${GOARCH}
platform: "linux"
version: "0.0.0"
section: "default"
priority: "extra"
maintainer: ${GIT_COMMITTER_NAME} <${GIT_COMMITTER_EMAIL}>
description: "Internet radio player for Icecast streams"
vendor: "JDB-NET Limited"
homepage: "https://github.com/jdbnet/icetray"
license: "MIT"
release: "1"

contents:
  - src: "./bin/icetray"
    dst: "/usr/local/bin/icetray"
  - src: "./build/appicon.png"
    dst: "/usr/share/icons/hicolor/128x128/apps/icetray.png"
  - src: "./build/linux/icetray.desktop"
    dst: "/usr/share/applications/icetray.desktop"

# Release Linux artifacts use -tags gtk3 (WebKit2GTK 4.1) for Ubuntu 22.04 / Debian 12.
depends:
  - libgtk-3-0
  - libwebkit2gtk-4.1-0
  - libasound2

overrides:
  rpm:
    depends:
      - gtk3
      - webkit2gtk4.1
      - alsa-lib
  archlinux:
    depends:
      - gtk3
      - webkit2gtk-4.1
      - alsa-lib

scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
