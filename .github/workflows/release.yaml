name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  APTUARY_DISTRIBUTION: stable
  APTUARY_COMPONENT: main

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semantic.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: semantic
        uses: go-semantic-release/action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  build-amd64:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.version.outputs.version }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build amd64 and Windows binaries
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: bash scripts/ci-build-amd64.sh

      - uses: actions/upload-artifact@v4
        with:
          name: dist-amd64
          path: |
            dist/icetray-linux-amd64
            dist/icetray-headless-linux-amd64
            dist/icetray-windows-amd64.exe
            dist/icetray-windows-arm64.exe
            dist/icetray-windows-amd64-setup.exe
            dist/icetray-windows-arm64-setup.exe

  build-arm64:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.version.outputs.version }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build arm64 binaries
        run: bash scripts/ci-build-arm64.sh

      - uses: actions/upload-artifact@v4
        with:
          name: dist-arm64
          path: |
            dist/icetray-linux-arm64
            dist/icetray-headless-linux-arm64

  build-android:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.version.outputs.version }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build signed Android APK and AAB
        env:
          VERSION: ${{ needs.version.outputs.version }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash scripts/ci-build-android.sh

      - uses: actions/upload-artifact@v4
        with:
          name: dist-android
          path: |
            dist/icetray-android.apk
            dist/icetray-android.aab

  publish:
    needs: [version, build-amd64, build-arm64, build-android]
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.version.outputs.version }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Merge build artifacts
        run: |
          mkdir -p dist
          for dir in dist/dist-*; do
            [ -d "$dir" ] || continue
            if [ -d "$dir/dist" ]; then
              mv "$dir"/dist/* dist/
            else
              mv "$dir"/* dist/
            fi
          done
          rm -rf dist/dist-*
          ls -lh dist/

      - name: Build Debian packages
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: bash scripts/ci-deb.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/icetray-linux-amd64
            dist/icetray-headless-linux-amd64
            dist/icetray-linux-arm64
            dist/icetray-headless-linux-arm64
            dist/icetray-windows-amd64.exe
            dist/icetray-windows-arm64.exe
            dist/icetray-windows-amd64-setup.exe
            dist/icetray-windows-arm64-setup.exe
            dist/icetray-android.apk
            dist/icetray-android.aab
            dist/icetray_*_*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Aptuary
        env:
          VERSION: ${{ needs.version.outputs.version }}
          APTUARY_URL: ${{ secrets.APTUARY_URL }}
          APTUARY_API_KEY: ${{ secrets.APTUARY_API_KEY }}
        run: |
          if [ -z "$APTUARY_URL" ] || [ -z "$APTUARY_API_KEY" ]; then
            echo "Skipping Aptuary upload (APTUARY_URL and APTUARY_API_KEY secrets not set)"
            exit 0
          fi
          BASE="${APTUARY_URL%/}"
          QUERY="distribution=${APTUARY_DISTRIBUTION}&component=${APTUARY_COMPONENT}"
          for deb in dist/icetray_${VERSION}_*.deb; do
            echo "Uploading ${deb}"
            curl -fsSL -X POST \
              -H "Authorization: Bearer ${APTUARY_API_KEY}" \
              -F "file=@${deb}" \
              "${BASE}/api/v1/upload?${QUERY}"
          done
