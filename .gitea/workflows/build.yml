name: Build and Upload Binaries

on:
  push:
    branches:
      - main

jobs:
  build-and-upload:
    runs-on: build-htz-01

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go environment
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install system dependencies (amd64 & windows)
        run: sudo apt-get update && sudo apt-get install -y gcc libgtk-3-dev libayatana-appindicator3-dev libasound2-dev mingw-w64

      - name: Build amd64 & windows binaries
        run: |
          GOOS=linux GOARCH=amd64 go build -o icetray-linux-amd64 .
          GOOS=linux GOARCH=amd64 go build -tags headless -o icetray-headless-linux-amd64 .
          go install github.com/tc-hib/go-winres@latest
          export PATH="$PATH:$(go env GOPATH)/bin"
          go-winres make
          GOOS=windows GOARCH=amd64 CGO_ENABLED=1 CC=x86_64-w64-mingw32-gcc go build -ldflags "-H=windowsgui" -o icetray-windows-amd64.exe .

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build arm64 binaries (via QEMU)
        run: |
          docker run --rm --platform linux/arm64 -v ${{ github.workspace }}:/workspace -w /workspace golang:1.25-bookworm bash -c "
            apt-get update && apt-get install -y gcc libgtk-3-dev libayatana-appindicator3-dev libasound2-dev
            go build -o icetray-linux-arm64 .
            go build -tags headless -o icetray-headless-linux-arm64 .
          "

      - name: Create release artifacts
        run: |
          mkdir -p dist
          mv icetray-linux-amd64 icetray-headless-linux-amd64 icetray-windows-amd64.exe dist/
          mv icetray-linux-arm64 icetray-headless-linux-arm64 dist/

      - name: Upload to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 cp dist/icetray-linux-amd64 s3://apps/icetray/icetray-linux --endpoint-url https://7d5f26fc811bce9e5fce50d5cd9914c6.r2.cloudflarestorage.com
          aws s3 cp dist/icetray-headless-linux-amd64 s3://apps/icetray/icetray-headless-linux --endpoint-url https://7d5f26fc811bce9e5fce50d5cd9914c6.r2.cloudflarestorage.com
          aws s3 cp dist/icetray-windows-amd64.exe s3://apps/icetray/icetray-windows.exe --endpoint-url https://7d5f26fc811bce9e5fce50d5cd9914c6.r2.cloudflarestorage.com
          aws s3 cp dist/icetray-linux-arm64 s3://apps/icetray/icetray-linux-arm64 --endpoint-url https://7d5f26fc811bce9e5fce50d5cd9914c6.r2.cloudflarestorage.com
          aws s3 cp dist/icetray-headless-linux-arm64 s3://apps/icetray/icetray-headless-linux-arm64 --endpoint-url https://7d5f26fc811bce9e5fce50d5cd9914c6.r2.cloudflarestorage.com

      - name: Clean up
        run: rm -rf dist rsrc_*.syso